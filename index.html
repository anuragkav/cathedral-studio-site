<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cathedral Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <span class="wordmark">CATHEDRAL STUDIO</span>
</header>

<main class="hero">
  <h1>Something is coming.</h1>
  <p class="sub">Limited drops. No stock held. Get notified before the first one.</p>

  <form id="waitlist-form" class="waitlist-form">
    <input type="email" id="email" name="email" placeholder="you@email.com" required autocomplete="email">
    <button type="submit">Notify me</button>
  </form>
  <p id="form-message" class="form-message" aria-live="polite"></p>
</main>

<footer class="bar">
  <p class="disclosure">All imagery on this site is AI-generated. Nothing you see is a photograph.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
